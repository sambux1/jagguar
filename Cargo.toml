[package]
name = "jagguar"
version = "0.1.0"
edition = "2024"
default-run = "jagguar"
description = "Single-server secure aggregation"
license = "MIT"
repository = "https://github.com/sambux1/aggregation"
documentation = "https://docs.rs/jagguar"
homepage = "https://jagguar.readthedocs.io"
readme = "README.md"

[package.metadata.docs.rs]
features = ["simulator"]

[dependencies]
ark-ff = "0.5.0"
ark-std = "0.5.0"
ark-serialize = "0.5.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
num-bigint = "0.4"
num-traits = "0.2"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
thiserror = "2"

[[bin]]
name = "simulator"
path = "src/simulator/main.rs"
required-features = ["simulator"]

[features]
default = []
simulator = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[bench]]
name = "shprg_expand"
harness = false

[[bench]]
name = "shprg_memory"
harness = false
