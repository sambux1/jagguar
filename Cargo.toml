[package]
name = "jagguar"
version = "0.1.0"
edition = "2024"
default-run = "jagguar"
description = "Single-server secure aggregation"
license = "MIT"
repository = "https://github.com/sambux1/aggregation"
documentation = "https://docs.rs/jagguar"
homepage = "https://jagguar.readthedocs.io"
readme = "README.md"

[workspace]
members = ["jagguar-wasm"]

[package.metadata.docs.rs]
features = ["simulator"]

[dependencies]
ark-ff = "0.5.0"
ark-std = "0.5.0"
ark-serialize = "0.5.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
tiny_http = { version = "0.12", optional = true }
pollster = { version = "0.4", optional = true }

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["native"]

[[bin]]
name = "committee"
path = "src/bin/committee.rs"
required-features = ["native"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["native"]

[[bin]]
name = "simulator"
path = "src/simulator/main.rs"
required-features = ["simulator"]

[features]
default = ["native"]
native = ["dep:pollster", "dep:tiny_http"]
simulator = ["native"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"

[[bench]]
name = "shprg_expand"
harness = false

[[bench]]
name = "shprg_memory"
harness = false
