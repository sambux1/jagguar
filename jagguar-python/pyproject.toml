[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jagguar"
version = "0.1.0"
description = "Python client interface for Jagguar single-server secure aggregation"
requires-python = ">=3.10"
license = "MIT"

[dependency-groups]
dev = ["pytest"]

[tool.maturin]
module-name = "jagguar"
