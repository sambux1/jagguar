# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    rust: latest
  jobs:
    # Publish rustdoc next to the MkDocs site. Linked from docs/content/api.md.
    post_build:
      - cargo doc --no-deps --features simulator
      - mkdir -p "$READTHEDOCS_OUTPUT/html/rustdoc"
      - cp -a target/doc/. "$READTHEDOCS_OUTPUT/html/rustdoc/"

mkdocs:
  configuration: docs/mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
